<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Resume dan CV Eka Hasbi Habibi.">
  <title>Resume | Eka Hasbi Habibi</title>
  <style>
    :root {
      --background: #fff7ee;
      --surface: #fff;
      --text: #1f2937;
      --muted: #667085;
      --primary: #ff8a3d;
      --primary-dark: #e8641f;
      --secondary: #243b6b;
      --border: #f0dfcf;
      --shadow: 0 22px 55px rgba(55, 34, 15, 0.13);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 8% 12%, rgba(255, 138, 61, 0.2), transparent 26%),
        radial-gradient(circle at 92% 8%, rgba(36, 59, 107, 0.15), transparent 23%),
        var(--background);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    a { color: inherit; text-decoration: none; }

    .container {
      width: min(1120px, calc(100% - 40px));
      margin-inline: auto;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid rgba(240, 223, 207, 0.8);
      background: rgba(255, 247, 238, 0.86);
      backdrop-filter: blur(16px);
    }

    .nav-inner {
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--secondary);
      font-weight: 800;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), #ffbe79);
    }

    .back-link {
      color: var(--secondary);
      font-size: 14px;
      font-weight: 800;
      transition: color 0.2s ease;
    }

    .back-link:hover { color: var(--primary-dark); }
    main { padding: 64px 0 80px; }

    .resume-header {
      max-width: 800px;
      margin: 0 auto 42px;
      text-align: center;
    }

    .kicker {
      margin-bottom: 10px;
      color: var(--primary-dark);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: 18px;
      color: var(--secondary);
      font-size: clamp(42px, 7vw, 72px);
      line-height: 1;
      letter-spacing: -0.055em;
    }

    .description {
      max-width: 680px;
      margin-inline: auto;
      color: var(--muted);
      line-height: 1.75;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 13px;
      margin-top: 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 22px;
      border: 1px solid transparent;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
      transition: transform 0.25s ease, background 0.25s ease;
    }

    .btn:hover { transform: translateY(-3px); }

    .btn-primary {
      color: #fff;
      background: var(--primary);
      box-shadow: 0 16px 30px rgba(255, 138, 61, 0.3);
    }

    .btn-primary:hover { background: var(--primary-dark); }

    .btn-outline {
      color: var(--secondary);
      background: rgba(255, 255, 255, 0.72);
      border-color: var(--border);
    }

    .pdf-preview {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .pdf-preview-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
    }

    .pdf-preview-head h2 { color: var(--secondary); font-size: 18px; }

    .pdf-preview iframe {
      display: block;
      width: 100%;
      height: 900px;
      border: 0;
      background: #f4f4f4;
    }

    .pdf-fallback {
      padding: 16px 22px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    .pdf-fallback a { color: var(--primary-dark); font-weight: 800; }

    @media (max-width: 800px) {
      main { padding: 48px 0 60px; }
      .pdf-preview iframe { height: 720px; }
    }

    @media (max-width: 520px) {
      .container { width: min(100% - 28px, 1120px); }
      .nav-inner { min-height: 66px; }
      .brand span:last-child { display: none; }
      .back-link { font-size: 13px; }
      .resume-header { margin-bottom: 30px; }
      .actions { display: grid; }
      .btn { width: 100%; }
      .pdf-preview-head { align-items: stretch; flex-direction: column; }
      .pdf-preview iframe { height: 600px; }
    }
  </style>
</head>

<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a class="brand" href="./index.html" aria-label="Kembali ke halaman utama">
        <span class="brand-mark">EH</span>
        <span>Eka Hasbi</span>
      </a>
      <a class="back-link" href="./index.html">← Kembali ke Portofolio</a>
    </div>
  </header>

  <main>
    <div class="container">
      <section class="resume-header">
        <p class="kicker">Resume</p>
        <h1>Curriculum Vitae</h1>
        <p class="description">
          Resume profesional yang merangkum pendidikan, pengalaman, proyek,
          sertifikasi, serta kompetensi saya dalam pengembangan sistem informasi.
        </p>

        <div class="actions">
          <a class="btn btn-outline" href="./documents/CV-Eka-Hasbi-Habibi.pdf" target="_blank" rel="noopener noreferrer">
            Lihat CV
          </a>
        </div>
      </section>

      <section class="pdf-preview" aria-label="Pratinjau CV Eka Hasbi Habibi">
        <div class="pdf-preview-head">
          <h2>Pratinjau CV</h2>
          <a class="btn btn-primary" href="./documents/CV-Eka-Hasbi-Habibi.pdf" download="CV-Eka-Hasbi-Habibi.pdf">
            ↓ Download CV
          </a>
        </div>

        <iframe
          src="./documents/CV-Eka-Hasbi-Habibi.pdf#view=FitH&amp;toolbar=1"
          title="CV Eka Hasbi Habibi"
          loading="lazy"
        ></iframe>

        <p class="pdf-fallback">
          <a href="./documents/CV-Eka-Hasbi-Habibi.pdf" target="_blank" rel="noopener noreferrer">buka PDF</a>.
        </p>
      </section>
    </div>
  </main>
</body>
</html>
